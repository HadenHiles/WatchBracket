name: Security scans
on:
  pull_request:
  push:
    branches: [master, main]
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

jobs:
  dependencies-and-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 10.34.5 }
      - uses: actions/setup-node@v4
        with: { node-version: 22.18.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level critical
      - name: Scan repository for secrets
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.2 detect --source=/repo --config=/repo/.gitleaks.toml --redact --no-banner

  containers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: web
            dockerfile: infra/docker/web.Dockerfile
          - name: game-api
            dockerfile: infra/docker/game-api.Dockerfile
          - name: integration-service
            dockerfile: infra/docker/integration-service.Dockerfile
          - name: cast-receiver
            dockerfile: infra/docker/cast-receiver.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t "watchbracket/${{ matrix.name }}:scan" -f "${{ matrix.dockerfile }}" .
      - name: Scan image for high-severity vulnerabilities
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.61.0 image --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL "watchbracket/${{ matrix.name }}:scan"
