name: Bug report
description: Report a reproducible Watch Bracket problem
title: "[Bug]: "
labels: [bug]
body:
  - type: checkboxes
    attributes:
      label: Safety check
      options:
        - label: I removed tokens, private addresses, room codes, and personal viewing data.
          required: true
  - type: textarea
    attributes: { label: What happened?, description: Include expected and actual behavior. }
    validations: { required: true }
  - type: textarea
    attributes: { label: Reproduction, description: Provide the smallest repeatable sequence. }
    validations: { required: true }
  - type: input
    attributes: { label: Revision or image tag }
  - type: dropdown
    attributes: { label: Surface, options: [Controller, Browser display, Chromecast, Integration, Deployment] }
    validations: { required: true }
  - type: textarea
    attributes: { label: Sanitized logs }
